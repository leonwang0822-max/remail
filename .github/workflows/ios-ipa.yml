name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Configure Flutter iOS build
        run: flutter build ios --config-only --release --no-codesign
      - name: Build iOS app without signing
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios/derived \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/derived/Build/Products/Release-iphoneos/Runner.app Payload/
          zip -qry Remail-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Remail-unsigned-ipa
          path: Remail-unsigned.ipa
          if-no-files-found: error
